name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Syntax and metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out extension
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up minimum PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.1'
          coverage: none
        env:
          fail-fast: true

      - name: Validate Composer metadata
        shell: bash
        run: |
          php -r '$data = json_decode(file_get_contents("composer.json"), true); if (!is_array($data) || json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, "Invalid composer.json\n"); exit(1); }'

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find styles -type f -name '*.js' -print0)

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out extension
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out phpBB 3.3
        uses: actions/checkout@v7
        with:
          repository: phpbb/phpbb
          ref: 3.3.x
          path: _forum
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          tools: composer:v2, phpunit:10.5
          coverage: none
        env:
          fail-fast: true

      - name: Install phpBB runtime dependencies
        run: composer install --working-dir=_forum --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Run test suite
        env:
          PHPBB_ROOT_PATH: ${{ github.workspace }}/_forum
        run: phpunit --configuration phpunit.xml.dist --colors=always
