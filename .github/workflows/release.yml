name: Build release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, for example v1.6.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Package published release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and package metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          version="${tag#v}"
          composer_version="$(php -r '$data = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); echo $data["version"];')"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${tag} is not a valid stable semantic version tag." >&2
            exit 1
          fi

          if [[ "$tag" != "v${composer_version}" ]]; then
            echo "Tag ${tag} does not match composer.json version ${composer_version}." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=advancedpolls-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build phpBB extension package
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail

          package_root="build/wolfsblvt/advancedpolls"
          mkdir -p "$package_root"
          git archive --format=tar HEAD | tar -xf - -C "$package_root"

          expected=(
            acp
            adm
            composer.json
            config
            controller
            core
            cron
            event
            ext.php
            language
            license.txt
            migrations
            notification
            styles
          )

          mapfile -t actual < <(find "$package_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${actual[@]}")" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
            echo "Unexpected release package contents:" >&2
            diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}") || true
            exit 1
          fi

          (
            cd build
            zip -X -r "../${ARCHIVE}" wolfsblvt
          )

          unexpected="$(unzip -Z1 "$ARCHIVE" | grep -Ev '^wolfsblvt/$|^wolfsblvt/advancedpolls(/.*)?$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected paths in release archive:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          unzip -Z1 "$ARCHIVE" | grep -Fxq 'wolfsblvt/advancedpolls/composer.json'

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload installable package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE#Installable phpBB extension package" \
            "${ARCHIVE}.sha256#SHA-256 checksum" \
            --clobber
